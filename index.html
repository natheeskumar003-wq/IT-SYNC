<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT DIGITAL HUB - Information Technology Department | Government College of Engineering, Erode</title>
  
  <!-- Meta description for academic portal -->
  <meta name="description" content="IT DIGITAL HUB - Official academic and department management portal for the Department of Information Technology at Government College of Engineering, Erode.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
              950: '#082f49'
            },
            accent: {
              cyan: '#06b6d4',
              emerald: '#10b981',
              amber: '#f59e0b',
              purple: '#8b5cf6',
              rose: '#f43f5e'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="src/styles/portal.css">

  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      background: #080d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">

  <!-- Initial Preloader -->
  <div id="initial-loader">
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-2xl shadow-cyan-500/30 mb-4 animate-pulse">
      <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16v16H4z"></path>
        <path d="M9 9h6v6H9z"></path>
        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"></path>
      </svg>
    </div>
    <h2 class="text-xl font-bold text-white tracking-tight">IT DIGITAL HUB</h2>
    <p class="text-xs text-cyan-400 font-semibold tracking-wider uppercase mt-1">Government College of Engineering, Erode</p>
    <div class="mt-6 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-bounce"></span>
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-bounce" style="animation-delay: 0.15s"></span>
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-bounce" style="animation-delay: 0.3s"></span>
    </div>
  </div>

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- App Core Data -->
  <script src="src/app.bundle.js"></script>

  <!-- Context & Main Auth Engine -->
  <script src="src/main.js"></script>

  <!-- UI Components -->
  <script src="src/components/common/UIComponents.js"></script>

  <!-- Role Sub-Views -->
  <script src="src/components/student/StudentViews.js"></script>
  <script src="src/components/staff/StaffViews.js"></script>
  <script src="src/components/hod/HODViews.js"></script>
  <script src="src/components/admin/AdminViews.js"></script>

  <!-- React Application Modules -->
  <script type="text/babel">

    const { useState, useEffect, useContext, createElement: h, Fragment } = React;
    const { AuthProvider, useAuth, Icons } = window.ITAuthContext;

    // Load sub-modules
    const RootApp = () => {
      useEffect(() => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 350);
        }
      }, []);

      return (
        <AuthProvider>
          <AppPortal />
        </AuthProvider>
      );
    };

    // Main App Controller
    const AppPortal = () => {
      const { currentUser } = useAuth();
      const AIAssistantComp = window.UIComponents?.AIAssistant;

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-100 font-sans">
          {!currentUser ? (
            <StandaloneLoginPage />
          ) : (
            <StandaloneDashboardLayout />
          )}
          <StandaloneToastContainer />
          {AIAssistantComp && <AIAssistantComp />}
        </div>
      );
    };

    // ==========================================
    // TOAST CONTAINER
    // ==========================================
    const StandaloneToastContainer = () => {
      const { toasts, removeToast } = useAuth();
      if (!toasts || toasts.length === 0) return null;

      return (
        <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
          {toasts.map(toast => {
            const isSuccess = toast.type === 'success';
            const isError = toast.type === 'error';
            return (
              <div
                key={toast.id}
                className={`pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl backdrop-blur-xl border text-xs font-medium animate-fade-in transition-all ${
                  isSuccess ? 'bg-emerald-950/90 border-emerald-500/40 text-emerald-200' :
                  isError ? 'bg-rose-950/90 border-rose-500/40 text-rose-200' :
                  'bg-slate-900/90 border-cyan-500/40 text-cyan-200'
                }`}
              >
                {isSuccess ? <Icons.CheckCircle className="w-4 h-4 text-emerald-400 flex-shrink-0" /> :
                 isError ? <Icons.AlertTriangle className="w-4 h-4 text-rose-400 flex-shrink-0" /> :
                 <Icons.Sparkles className="w-4 h-4 text-cyan-400 flex-shrink-0" />}
                <span className="flex-1">{toast.message}</span>
                <button onClick={() => removeToast(toast.id)} className="p-1 hover:bg-white/10 rounded text-slate-400 hover:text-white">
                  <Icons.X className="w-3.5 h-3.5" />
                </button>
              </div>
            );
          })}
        </div>
      );
    };

    // ==========================================
    // LOGIN PAGE (GLASSMORPHISM & CAMPUS BACKGROUND)
    // ==========================================
    const StandaloneLoginPage = () => {
      const { login, demoCredentials, collegeInfo } = useAuth();
      const [selectedRole, setSelectedRole] = useState('student');
      const [userId, setUserId] = useState(demoCredentials.student.id);
      const [password, setPassword] = useState(demoCredentials.student.pass);
      const [showPassword, setShowPassword] = useState(false);
      const [rememberMe, setRememberMe] = useState(true);
      const [isLoading, setIsLoading] = useState(false);
      const [forgotModalOpen, setForgotModalOpen] = useState(false);

      const handleRoleSelect = (role) => {
        setSelectedRole(role);
        setUserId(demoCredentials[role].id);
        setPassword(demoCredentials[role].pass);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setIsLoading(true);
        setTimeout(() => {
          login(selectedRole, userId, password);
          setIsLoading(false);
        }, 400);
      };

      const roleTabs = [
        { key: 'student', label: 'Student', icon: Icons.GraduationCap },
        { key: 'staff', label: 'Staff', icon: Icons.BookOpen },
        { key: 'hod', label: 'HOD', icon: Icons.Award },
        { key: 'admin', label: 'Admin', icon: Icons.Shield }
      ];

      return (
        <div className="relative min-h-screen flex items-center justify-center p-4 sm:p-6 overflow-hidden select-none">
          {/* Full Screen Campus Background Image */}
          <div
            className="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat transition-all duration-700 transform scale-105"
            style={{
              backgroundImage: `url('assets/images/IT sync_dashboard sample img.jpeg'), url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=2000&q=85')`
            }}
          />

          {/* Dark Glass Overlay */}
          <div className="absolute inset-0 z-0 bg-gradient-to-tr from-slate-950 via-slate-900/85 to-slate-950/90 backdrop-blur-sm" />

          {/* Glowing Accents */}
          <div className="absolute -top-32 -left-32 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none" />
          <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none" />

          {/* Glassmorphism Card */}
          <div className="relative z-10 w-full max-w-xl glass-panel rounded-3xl p-6 sm:p-10 border border-slate-700/60 shadow-2xl shadow-black/80 animate-fade-in">
            {/* Crest & Title */}
            <div className="text-center mb-6">
              <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-700 shadow-xl shadow-cyan-900/40 mb-3 border border-white/20">
                <Icons.Cpu className="w-8 h-8 text-white" />
              </div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">{collegeInfo.portalTitle}</h1>
              <p className="text-sm font-bold text-cyan-400 mt-1 uppercase tracking-wider">{collegeInfo.department}</p>
              <p className="text-xs text-slate-300 mt-0.5">{collegeInfo.name}</p>
              <span className="inline-block mt-2 px-2.5 py-0.5 text-[10px] font-bold uppercase tracking-widest rounded-full bg-slate-800/80 border border-slate-700 text-slate-300">
                Autonomous • Counseling Code: 7304
              </span>
            </div>

            {/* 4 Role Selection Tabs */}
            <div className="grid grid-cols-4 gap-2 mb-6 p-1.5 rounded-2xl bg-slate-950/70 border border-slate-800">
              {roleTabs.map(tab => {
                const isSelected = selectedRole === tab.key;
                const TabIcon = tab.icon;
                return (
                  <button
                    key={tab.key}
                    type="button"
                    onClick={() => handleRoleSelect(tab.key)}
                    className={`flex flex-col items-center justify-center p-2 rounded-xl transition-all duration-200 text-xs font-semibold ${
                      isSelected
                        ? 'bg-gradient-to-br from-cyan-600 to-blue-700 text-white shadow-lg shadow-cyan-950 border border-cyan-400/40 scale-[1.02]'
                        : 'text-slate-400 hover:text-white hover:bg-slate-900/70'
                    }`}
                  >
                    <TabIcon className={`w-4 h-4 mb-1 ${isSelected ? 'text-white' : 'text-slate-400'}`} />
                    <span>{tab.label}</span>
                  </button>
                );
              })}
            </div>

            {/* Form */}
            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
                  {selectedRole.toUpperCase()} User ID
                </label>
                <div className="relative">
                  <Icons.User className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                  <input
                    type="text"
                    required
                    value={userId}
                    onChange={(e) => setUserId(e.target.value)}
                    className="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl glass-input placeholder-slate-500 font-medium"
                  />
                </div>
              </div>

              <div>
                <div className="flex items-center justify-between mb-1.5">
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-300">
                    Password
                  </label>
                  <button
                    type="button"
                    onClick={() => setForgotModalOpen(true)}
                    className="text-xs text-cyan-400 hover:text-cyan-300 font-medium"
                  >
                    Forgot Password?
                  </button>
                </div>
                <div className="relative">
                  <Icons.Shield className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                  <input
                    type={showPassword ? 'text' : 'password'}
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full pl-10 pr-11 py-2.5 text-sm rounded-xl glass-input placeholder-slate-500 font-medium"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1"
                  >
                    {showPassword ? <Icons.EyeOff className="w-4 h-4" /> : <Icons.Eye className="w-4 h-4" />}
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between text-xs text-slate-400">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={rememberMe}
                    onChange={(e) => setRememberMe(e.target.checked)}
                    className="w-4 h-4 rounded border-slate-700 bg-slate-900 text-cyan-500"
                  />
                  <span>Keep me logged in</span>
                </label>
                <span className="flex items-center gap-1 text-[11px] text-emerald-400 font-medium">
                  <Icons.Shield className="w-3 h-3" /> SSL 256-bit Encrypted
                </span>
              </div>

              <button
                type="submit"
                disabled={isLoading}
                className="w-full py-3 px-4 rounded-xl text-sm font-bold text-white gradient-btn-primary flex items-center justify-center gap-2 disabled:opacity-50"
              >
                {isLoading ? (
                  <span>Authenticating...</span>
                ) : (
                  <>
                    <span>Login to {selectedRole.toUpperCase()} Portal</span>
                    <Icons.ArrowRight className="w-4 h-4" />
                  </>
                )}
              </button>
            </form>

            {/* Quick Demo Credentials */}
            <div className="mt-6 pt-4 border-t border-slate-800/80">
              <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider text-center mb-2.5">
                ⚡ Quick Demo Credentials (Click to Load)
              </p>
              <div className="grid grid-cols-2 gap-2 text-xs">
                {[
                  { role: 'student', label: 'Student (24IT001)' },
                  { role: 'staff', label: 'Staff (ITSTAFF01)' },
                  { role: 'hod', label: 'HOD (ITHOD01)' },
                  { role: 'admin', label: 'Admin (ITADMIN01)' }
                ].map(demo => (
                  <button
                    key={demo.role}
                    type="button"
                    onClick={() => handleRoleSelect(demo.role)}
                    className={`px-2.5 py-1.5 rounded-lg border text-left truncate transition ${
                      selectedRole === demo.role
                        ? 'bg-cyan-500/10 border-cyan-500/40 text-cyan-300 font-bold'
                        : 'bg-slate-900/40 border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800'
                    }`}
                  >
                    {demo.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Forgot Modal */}
          {forgotModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
              <div className="w-full max-w-md glass-panel rounded-2xl p-6 border border-slate-700 space-y-4 text-xs">
                <h3 className="text-base font-bold text-white flex items-center justify-between">
                  <span>Credential Assistance</span>
                  <button onClick={() => setForgotModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </h3>
                <p className="text-slate-300">Default Demo Credentials:</p>
                <div className="p-3 rounded-xl bg-slate-900/80 border border-slate-800 space-y-1 text-slate-200">
                  <p>• Student: <span className="font-mono text-cyan-400 font-bold">24IT001 / student123</span></p>
                  <p>• Staff: <span className="font-mono text-emerald-400 font-bold">ITSTAFF01 / staff123</span></p>
                  <p>• HOD: <span className="font-mono text-purple-400 font-bold">ITHOD01 / hod123</span></p>
                  <p>• Admin: <span className="font-mono text-amber-400 font-bold">ITADMIN01 / admin123</span></p>
                </div>
                <button
                  onClick={() => setForgotModalOpen(false)}
                  className="w-full py-2 rounded-xl bg-cyan-600 text-white font-bold"
                >
                  Close
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // DASHBOARD LAYOUT & VIEW LOADER
    // ==========================================
    const StandaloneDashboardLayout = () => {
      const { currentUser } = useAuth();
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isCollapsed, setIsCollapsed] = useState(false);
      const [isMobileOpen, setIsMobileOpen] = useState(false);

      useEffect(() => {
        setActiveTab('dashboard');
      }, [currentUser?.role]);

      const activeRole = currentUser?.role || 'student';

      return (
        <div className="min-h-screen flex flex-col">
          {/* Main Content Router */}
          <StandaloneRouter
            activeRole={activeRole}
            currentTab={activeTab}
            onSelectTab={setActiveTab}
            isCollapsed={isCollapsed}
            onToggleCollapse={() => setIsCollapsed(!isCollapsed)}
            isMobileOpen={isMobileOpen}
            onToggleMobile={() => setIsMobileOpen(!isMobileOpen)}
            onCloseMobile={() => setIsMobileOpen(false)}
          />
        </div>
      );
    };

    // Router component connecting to StudentViews, StaffViews, HODViews, AdminViews
    const StandaloneRouter = ({ activeRole, currentTab, onSelectTab, isCollapsed, onToggleCollapse, isMobileOpen, onToggleMobile, onCloseMobile }) => {
      const { logout, notifications, markAllNotificationsRead, collegeInfo, currentUser } = useAuth();
      const [showNotifs, setShowNotifs] = useState(false);
      const [showUserMenu, setShowUserMenu] = useState(false);

      const navConfigs = {
        student: [
          { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
          { id: 'my-profile', label: 'My Profile', icon: Icons.User },
          { id: 'subjects', label: 'Subjects', icon: Icons.BookOpen },
          { id: 'attendance', label: 'Attendance', icon: Icons.CheckCircle, badge: '89.5%' },
          { id: 'internal-marks', label: 'Internal Marks', icon: Icons.BarChart },
          { id: 'semester-results', label: 'Semester Results', icon: Icons.Award },
          { id: 'study-materials', label: 'Study Materials', icon: Icons.Download },
          { id: 'assignments', label: 'Assignments', icon: Icons.FileText, badge: '2 Due' },
          { id: 'timetable', label: 'Timetable', icon: Icons.Calendar },
          { id: 'faculty-details', label: 'Faculty Details', icon: Icons.Users },
          { id: 'department-announcements', label: 'Announcements', icon: Icons.Bell, badge: 'New' },
          { id: 'previous-year-question-papers', label: 'Question Papers', icon: Icons.Database },
          { id: 'placement-internship', label: 'Placement & Internship', icon: Icons.Briefcase, badge: 'Drives' },
          { id: 'achievements', label: 'Achievements', icon: Icons.Sparkles },
          { id: 'certificates', label: 'Certificates', icon: Icons.Award },
          { id: 'notifications', label: 'Notifications', icon: Icons.Bell },
          { id: 'feedback', label: 'Feedback', icon: Icons.MessageSquare }
        ],
        staff: [
          { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
          { id: 'my-profile', label: 'My Profile', icon: Icons.User },
          { id: 'my-subjects', label: 'My Subjects', icon: Icons.BookOpen },
          { id: 'student-list', label: 'Student List', icon: Icons.Users },
          { id: 'attendance-management', label: 'Attendance Management', icon: Icons.CheckCircle },
          { id: 'internal-marks', label: 'Internal Marks', icon: Icons.BarChart },
          { id: 'assignments', label: 'Assignments', icon: Icons.FileText, badge: 'Review' },
          { id: 'upload-study-materials', label: 'Upload Materials', icon: Icons.Upload },
          { id: 'timetable', label: 'Timetable', icon: Icons.Calendar },
          { id: 'announcements', label: 'Announcements', icon: Icons.Bell },
          { id: 'student-performance', label: 'Student Performance', icon: Icons.PieChart },
          { id: 'notifications', label: 'Notifications', icon: Icons.Bell }
        ],
        hod: [
          { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard, badge: 'Analytics' },
          { id: 'hod-profile', label: 'HOD Profile', icon: Icons.User },
          { id: 'student-management', label: 'Student Management', icon: Icons.Users },
          { id: 'staff-management', label: 'Staff Management', icon: Icons.Award, badge: 'Leave Req' },
          { id: 'attendance-monitoring', label: 'Attendance Audit', icon: Icons.CheckCircle, badge: '12 Low' },
          { id: 'internal-marks-monitoring', label: 'Internal Marks Audit', icon: Icons.BarChart },
          { id: 'student-performance', label: 'Student Performance', icon: Icons.PieChart },
          { id: 'subject-management', label: 'Subject Management', icon: Icons.BookOpen },
          { id: 'timetable-management', label: 'Timetable Management', icon: Icons.Calendar },
          { id: 'department-announcements', label: 'Department Circulars', icon: Icons.Bell },
          { id: 'study-materials', label: 'Study Materials', icon: Icons.Download },
          { id: 'placement-internship', label: 'Placement Stats', icon: Icons.Briefcase, badge: '86.5%' },
          { id: 'reports', label: 'Reports', icon: Icons.FileText, badge: 'NAAC/NBA' },
          { id: 'notifications', label: 'Notifications', icon: Icons.Bell }
        ],
        admin: [
          { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
          { id: 'user-management', label: 'User Management', icon: Icons.Users },
          { id: 'student-management', label: 'Student Management', icon: Icons.GraduationCap },
          { id: 'staff-management', label: 'Staff Management', icon: Icons.Award },
          { id: 'hod-management', label: 'HOD Management', icon: Icons.Shield },
          { id: 'department-settings', label: 'Department Settings', icon: Icons.Cpu },
          { id: 'subject-management', label: 'Subject Management', icon: Icons.BookOpen },
          { id: 'semester-management', label: 'Semester Management', icon: Icons.Calendar },
          { id: 'attendance-management', label: 'Attendance Settings', icon: Icons.CheckCircle },
          { id: 'marks-management', label: 'Marks Management', icon: Icons.BarChart },
          { id: 'timetable-management', label: 'Timetable Management', icon: Icons.Calendar },
          { id: 'announcements', label: 'Announcements', icon: Icons.Bell },
          { id: 'study-materials', label: 'Study Materials', icon: Icons.Download },
          { id: 'reports', label: 'Reports & Logs', icon: Icons.FileText, badge: 'Audit' },
          { id: 'system-settings', label: 'System Settings', icon: Icons.Settings }
        ]
      };

      const currentNav = navConfigs[activeRole] || navConfigs.student;

      return (
        <div className="flex min-h-screen">
          {/* Mobile Overlay */}
          {isMobileOpen && (
            <div onClick={onCloseMobile} className="fixed inset-0 z-40 bg-black/75 backdrop-blur-sm lg:hidden" />
          )}

          {/* Sidebar */}
          <aside className={`fixed top-0 bottom-0 left-0 z-40 bg-slate-950/95 lg:bg-slate-950/80 backdrop-blur-2xl border-r border-slate-800/80 flex flex-col justify-between transition-all duration-300 ${
            isMobileOpen ? 'translate-x-0 w-72' : '-translate-x-full lg:translate-x-0'
          } ${isCollapsed ? 'lg:w-20' : 'lg:w-72'}`}>
            {/* Top Brand */}
            <div className="p-5 border-b border-slate-800/80 flex items-center justify-between">
              <div className="flex items-center gap-3 overflow-hidden">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-cyan-900/30 flex-shrink-0">
                  <Icons.Cpu className="w-6 h-6" />
                </div>
                {!isCollapsed && (
                  <div className="flex flex-col">
                    <span className="font-extrabold text-sm tracking-tight text-white">{collegeInfo.portalTitle}</span>
                    <span className="text-[10px] font-semibold text-cyan-400 truncate max-w-[160px]">IT Dept • GCE Erode</span>
                  </div>
                )}
              </div>
              <button onClick={onToggleCollapse} className="hidden lg:flex p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
                <Icons.ChevronRight className={`w-4 h-4 transition-transform ${isCollapsed ? '' : 'rotate-180'}`} />
              </button>
              <button onClick={onCloseMobile} className="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-white">
                <Icons.X className="w-5 h-5" />
              </button>
            </div>

            {/* Nav Menu Items */}
            <nav className="flex-1 overflow-y-auto px-3 py-4 space-y-1">
              {currentNav.map(item => {
                const isActive = currentTab === item.id;
                const ItemIcon = item.icon;
                return (
                  <button
                    key={item.id}
                    onClick={() => {
                      onSelectTab(item.id);
                      if (onCloseMobile) onCloseMobile();
                    }}
                    title={isCollapsed ? item.label : undefined}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all duration-200 group ${
                      isActive
                        ? 'bg-gradient-to-r from-cyan-500/20 to-blue-600/20 text-cyan-300 border border-cyan-500/30 shadow-lg shadow-cyan-950/50'
                        : 'text-slate-400 hover:text-slate-100 hover:bg-slate-900/60'
                    }`}
                  >
                    <ItemIcon className={`w-5 h-5 flex-shrink-0 transition-transform group-hover:scale-110 ${isActive ? 'text-cyan-400' : 'text-slate-400 group-hover:text-cyan-300'}`} />
                    {!isCollapsed && <span className="flex-1 text-left truncate">{item.label}</span>}
                    {!isCollapsed && item.badge && (
                      <span className="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>

            {/* Bottom Sign Out */}
            <div className="p-3 border-t border-slate-800/80 bg-slate-950/60">
              <button
                onClick={logout}
                title={isCollapsed ? 'Logout' : undefined}
                className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-rose-400 hover:text-rose-300 hover:bg-rose-950/40 border border-transparent hover:border-rose-800/40 transition"
              >
                <Icons.LogOut className="w-5 h-5 flex-shrink-0 text-rose-400" />
                {!isCollapsed && <span className="flex-1 text-left">Sign Out</span>}
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <div className={`flex-1 flex flex-col transition-all duration-300 ${isCollapsed ? 'lg:pl-20' : 'lg:pl-72'}`}>
            {/* Topbar */}
            <header className="sticky top-0 z-30 h-16 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl px-4 lg:px-8 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <button onClick={onToggleMobile} className="lg:hidden p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800">
                  <Icons.Menu className="w-6 h-6" />
                </button>
                <div className="hidden sm:flex flex-col">
                  <div className="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-slate-400">
                    <span className="text-cyan-400">GCE ERODE</span>
                    <span>•</span>
                    <span>IT DEPARTMENT</span>
                  </div>
                  <h2 className="text-sm font-bold text-white capitalize">{currentTab.replace(/-/g, ' ')}</h2>
                </div>
              </div>

              {/* Right Profile & Notifs */}
              <div className="flex items-center gap-3">
                <span className="hidden sm:inline-flex px-3 py-1 rounded-full border text-xs font-bold uppercase tracking-wider bg-cyan-500/10 text-cyan-400 border-cyan-500/30">
                  {activeRole}
                </span>

                {/* Notifications Drawer */}
                <div className="relative">
                  <button onClick={() => setShowNotifs(!showNotifs)} className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 relative">
                    <Icons.Bell className="w-5 h-5" />
                    {notifications.filter(n => !n.read).length > 0 && (
                      <span className="absolute top-1 right-1 w-4 h-4 bg-cyan-500 text-slate-950 font-extrabold text-[10px] rounded-full flex items-center justify-center animate-bounce">
                        {notifications.filter(n => !n.read).length}
                      </span>
                    )}
                  </button>

                  {showNotifs && (
                    <div className="absolute right-0 mt-3 w-80 sm:w-96 glass-panel rounded-2xl border border-slate-700 shadow-2xl p-4 z-50 animate-fade-in">
                      <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                        <h4 className="font-bold text-sm text-white flex items-center gap-2">
                          <Icons.Bell className="w-4 h-4 text-cyan-400" /> Notifications
                        </h4>
                        <button onClick={markAllNotificationsRead} className="text-xs text-cyan-400 hover:underline">
                          Mark all read
                        </button>
                      </div>
                      <div className="py-2 space-y-2 max-h-72 overflow-y-auto">
                        {notifications.map(n => (
                          <div key={n.id} onClick={() => { onSelectTab(n.link); setShowNotifs(false); }} className={`p-2.5 rounded-xl border text-xs cursor-pointer ${n.read ? 'bg-slate-900/40 border-slate-800 text-slate-400' : 'bg-cyan-950/40 border-cyan-500/30 text-slate-200'}`}>
                            <p className="font-semibold text-white">{n.title}</p>
                            <span className="text-[10px] text-slate-400 block mt-1">{n.time}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* Profile Pill */}
                <div className="flex items-center gap-2 pl-2 border-l border-slate-800">
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-600 to-blue-700 text-white font-bold flex items-center justify-center text-sm shadow-md">
                    {currentUser?.name ? currentUser.name.charAt(0) : 'U'}
                  </div>
                  <div className="hidden lg:flex flex-col text-left">
                    <span className="text-xs font-bold text-white truncate max-w-[120px]">{currentUser?.name}</span>
                    <span className="text-[10px] text-slate-400 capitalize">{activeRole}</span>
                  </div>
                </div>
              </div>
            </header>

            {/* Dynamic Views based on active role */}
            <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
              <DynamicRoleView activeRole={activeRole} currentTab={currentTab} onNavigate={onSelectTab} />
            </main>

            {/* Footer */}
            <footer className="border-t border-slate-900 bg-slate-950/60 py-4 px-6 text-center text-xs text-slate-500">
              <p>© 2026 Department of Information Technology • Government College of Engineering, Erode (Autonomous). All Rights Reserved.</p>
            </footer>
          </div>
        </div>
      );
    };

    // Sub-views connector
    const DynamicRoleView = ({ activeRole, currentTab, onNavigate }) => {
      // Load modules
      if (activeRole === 'student' && window.ITStudentViews) {
        const Comp = window.ITStudentViews;
        return <Comp currentTab={currentTab} onNavigate={onNavigate} />;
      }
      if (activeRole === 'staff' && window.ITStaffViews) {
        const Comp = window.ITStaffViews;
        return <Comp currentTab={currentTab} onNavigate={onNavigate} />;
      }
      if (activeRole === 'hod' && window.ITHODViews) {
        const Comp = window.ITHODViews;
        return <Comp currentTab={currentTab} onNavigate={onNavigate} />;
      }
      if (activeRole === 'admin' && window.ITAdminViews) {
        const Comp = window.ITAdminViews;
        return <Comp currentTab={currentTab} onNavigate={onNavigate} />;
      }
      return (
        <div className="p-12 text-center text-slate-400 glass-panel rounded-2xl border border-slate-800 animate-pulse">
          <p className="font-bold text-base text-cyan-400">Loading {activeRole.toUpperCase()} Module...</p>
          <p className="text-xs text-slate-500 mt-1">Please wait a moment</p>
        </div>
      );
    };

    // Mount to React DOM
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<RootApp />);
  </script>
</body>
</html>
