<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',

              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
              950: '#082f49'
            },
            accent: {
              cyan: '#06b6d4',
              emerald: '#10b981',
              amber: '#f59e0b',
              purple: '#8b5cf6',
              rose: '#f43f5e'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM (High-Speed Local Vendor with CDN Fallback) -->
  <script src="assets/vendor/react/react.production.min.js"></script>
  <script src="assets/vendor/react/react-dom.production.min.js"></script>
  <script>
    if (typeof React === 'undefined') {
      document.write('<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
      document.write('<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="src/styles/portal.css">

  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      background: #080d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">

  <!-- Initial Preloader -->
  <div id="initial-loader">
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-2xl shadow-cyan-500/30 mb-4 animate-pulse">
      <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16v16H4z"></path>
        <path d="M9 9h6v6H9z"></path>
        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"></path>
      </svg>
    </div>
    <h2 class="text-xl font-bold text-white tracking-tight">IT DIGITAL HUB</h2>
    <p class="text-xs text-cyan-400 font-semibold tracking-wider uppercase mt-1">Government College of Engineering, Erode</p>
    <div class="mt-6 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-bounce"></span>
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-bounce" style="animation-delay: 0.15s"></span>
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-bounce" style="animation-delay: 0.3s"></span>
    </div>
  </div>

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- App Core Data -->
  <script src="src/app.bundle.js"></script>

  <!-- Unified API Service Layer -->
  <script src="src/services/api.js"></script>

  <!-- Context & Main Auth Engine -->
  <script src="src/main.js"></script>

  <!-- UI Components -->
  <script src="src/components/common/UIComponents.js"></script>

  <!-- Role Sub-Views -->
  <script src="src/components/student/StudentViews.js"></script>
  <script src="src/components/staff/StaffViews.js"></script>
  <script src="src/components/hod/HODViews.js"></script>
  <script src="src/components/admin/AdminViews.js"></script>
  <script src="src/components/gallery/GalleryView.js"></script>

  <!-- Precompiled React Application Portal (Instant 0ms Launch - Zero Babel Compilation Delay) -->
  <script src="src/app-portal.js"></script>

  <!-- Instant Preloader Dismissal (0ms Launch) -->
  <script>
    function dismissInitialLoader() {
      var loader = document.getElementById('initial-loader');
      if (loader && loader.parentNode) {
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(function() { if (loader && loader.parentNode) loader.remove(); }, 100);
      }
    }
    if (document.readyState === 'complete') {
      dismissInitialLoader();
    } else {
      window.addEventListener('load', dismissInitialLoader);
      setTimeout(dismissInitialLoader, 250);
    }
  </script>
</body>
</html>
